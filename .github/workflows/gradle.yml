# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  CI-CD:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: docker build & docker hub push
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t "${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}" .
          docker push "${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}"

  Deploy:
    needs: CI-CD
    if: github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Deploy to prod
        shell: powershell
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          $env:DOCKER_PASSWORD | docker login -u $env:DOCKER_USERNAME --password-stdin
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $image = "$env:DOCKER_USERNAME/eureka:$env:IMAGE_TAG"

          docker pull $image
          if ($LASTEXITCODE -ne 0) { exit 1 }

          docker network inspect spharos 2>$null
          if ($LASTEXITCODE -ne 0) {
            docker network create spharos
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

          docker container inspect eureka 2>$null
          if ($LASTEXITCODE -eq 0) {
            docker rm -f eureka
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

          docker run -d --name eureka --restart unless-stopped --network spharos -p 8761:8761 $image
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check Eureka Container
        shell: powershell
        run: |
          docker ps --filter "name=^/eureka$"